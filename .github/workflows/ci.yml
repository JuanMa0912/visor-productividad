name: CI

on:
  pull_request:
    branches:
      - main
  # Sin push a main: evita correr lint/test/build en cada merge o subida directa.
  # Ejecuta manualmente desde Actions → CI → "Run workflow" cuando lo necesites.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Explicit heap for ubuntu-latest; local/Linux deploys use scripts/build.mjs heuristics.
      NEXT_BUILD_MEMORY_MB: "4096"
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: produXdia
      DB_USER: postgres
      DB_PASSWORD: ci-placeholder
      DB_SCHEMA: public
      AUDIT_IP_HMAC_SECRET: ci-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # setup-node trae el npm que venga con Node 22 (10.9.x), y esa version no
      # entiende `min-release-age`, el cooldown que fija el .npmrc del repo: lo
      # ignoraria con un warning y el CI resolveria sin proteccion. Se fija la
      # misma version que corre en local y en el servidor 232.
      - name: Pin npm (min-release-age necesita >= 11.10.0)
        run: npm install -g npm@11.19.0

      # --ignore-scripts es explicito aunque el .npmrc del repo ya lo fija: si
      # alguien borra esa linea, el CI sigue protegido. Los compromisos de npm de
      # 2026 (axios, @asyncapi, keyv/cacheable) ejecutaban su carga desde un hook
      # preinstall, y un runner de CI con credenciales es el objetivo preferido.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Verifica que cada tarball descargado esta firmado por el registro y que la
      # firma corresponde. Detecta manipulacion en transito o en un espejo.
      # No sustituye a `npm audit`: comprueba INTEGRIDAD, no vulnerabilidades.
      - name: Verify registry signatures
        run: npm audit signatures

      - name: Validate
        run: npm run ci
